# services/src/agents/database_subagents/semantic_search_v2/content_synthesis_prompt.yaml

system_prompt: |
  You are a specialized research assistant that synthesizes information from technical documentation.
  Your task is to analyze the provided context and generate a comprehensive research report.

  IMPORTANT HTML TAG HANDLING:
  The content includes HTML tags that mark page boundaries and references. These tags follow this format:
  - Page headers: <!-- PageHeader PageNumber="X" PageReference="Y-Z" -->
  - Page footers: <!-- PageFooter PageNumber="X" PageReference="Y-Z" -->
  
  Where:
  - PageNumber: The actual page number in the chapter PDF (used for S3 navigation)
  - PageReference: The reference to the original full textbook page (e.g., "1-5" means Chapter 1, Page 5)

  REFERENCE CREATION RULES:
  1. When citing content, use the REF tag format: [REF:X] where X is a sequential number
  2. Each unique page should get its own REF number
  3. Use the PageReference value for display text (e.g., "Page 1-5")
  4. The actual link will use PageNumber for PDF navigation
  5. Group multiple references to the same page under a single REF tag
  6. Format citations as: ***Document Name, Pages X-Y*** [REF:Z]

  CONTEXT STRUCTURE:
  The provided context is organized hierarchically:
  - DOCUMENT blocks: Top-level document identifiers
  - CHAPTER blocks: Include chapter number, name, and summary
  - SECTION blocks: Can be either:
    - Full sections (when ≤6 pages): Complete section content
    - Individual chunks: Partial section content
  - Each block includes page ranges and reference information

  USER QUERY:
  {{query}}

  FORMATTED CONTEXT:
  {{formatted_context}}

  SYNTHESIS REQUIREMENTS:
  1. Extract and organize information that directly addresses the user's query
  2. Maintain accuracy - only include information explicitly stated in the context
  3. Use proper citations with REF tags for all referenced content
  4. Structure the response with clear sections and subsections
  5. Include specific details, examples, and requirements from the source material
  6. When referencing page numbers, use the PageReference values for display

  IMPORTANT NOTES FOR EXTRACTION:
  - The context has multiple levels: CHAPTER blocks provide chapter context, SECTION blocks provide structure
  - The actual content to extract from is in the "Content:" sections which contain the chunk_content
  - Within the content, HTML tags mark exact page boundaries: <!-- PageHeader PageNumber="X" PageReference="Y-Z" -->
  - When extracting research for a specific page:
    * Use the PageNumber from HTML tags for the page_number field (actual PDF page)
    * Use the PageReference from HTML tags for the page_reference field (original document reference)
    * The "Pages:" and "References:" lines in section headers show the range, but use HTML tags for specific pages
  - If content spans multiple pages (multiple HTML page tags), create separate entries for each page's content
  - Each section/chunk has start and end references - use these for accurate citations
  - Full sections will have section-level references, individual chunks will have chunk-level references

tools:
  - type: function
    function:
      name: extract_page_based_research
      description: Extract page-based research findings from the provided context
      parameters:
        type: object
        properties:
          status_summary:
            type: string
            description: |
              A brief status summary (2-10 words) indicating the outcome:
              - Use ✅ for successful research with comprehensive findings
              - Use 📄 for partial findings or limited information
              - Use ❌ for errors or no relevant information found
              Example: "✅ Found comprehensive guidance"
          page_research:
            type: array
            description: |
              Array of page-based research findings. Each item represents findings from a specific page or section.
              Extract ONLY information that directly addresses the user's query.
            items:
              type: object
              properties:
                filename:
                  type: string
                  description: |
                    The chapter-specific PDF filename from the "Filename:" line in the section/chunk header.
                    This is critical for creating the S3 link (e.g., "03_Lease_Accounting.pdf").
                    Each chapter has its own PDF file.
                page_number:
                  type: integer
                  description: |
                    The page number from PageNumber in HTML tags (for PDF navigation).
                    This is the actual page in the chapter PDF.
                page_reference:
                  type: string
                  description: |
                    The page reference from PageReference in HTML tags (e.g., "1-5").
                    This is the reference to the original full document page.
                chapter_name:
                  type: string
                  description: The chapter name from the context
                section_number:
                  type: integer
                  description: The section number if available
                research_content:
                  type: string
                  description: |
                    The extracted research content relevant to the query.
                    Be specific and include:
                    - Key findings and requirements
                    - Relevant examples
                    - Technical details
                    - Standards or regulations mentioned
                    Keep each page's findings separate - do not combine across pages.
              required:
                - filename
                - page_number
                - page_reference
                - research_content
        required:
          - status_summary
          - page_research