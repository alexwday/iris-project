sample_questions:
- What was APG's documented reasoning for the accounting treatment of cloud computing implementation costs?
- Is there a memo explaining why RBC chose a particular approach for syndicated loan derecognition?
- What alternatives were considered for expected credit loss modeling on off-balance-sheet commitments?
- Has APG issued a formal position on embedded derivative assessment for structured products?
