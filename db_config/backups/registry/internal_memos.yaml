db_source: internal_memos
db_name: APG Internal Accounting Memos
db_summary: Detailed technical analyses on complex accounting topics, written by RBC finance teams and approved by the Accounting
  Policy Group (APG), offering in-depth guidance on specific issues.
db_description: '**Content:** Formal internal accounting memos written by RBC finance teams and approved by the Accounting
  Policy Group (APG). Each memo documents detailed technical analyses of specific accounting issues, capturing the question
  raised, alternatives considered, reasoning applied, and the final decision/resolution.


  **Tier/Priority:** SUPPLEMENTARY SOURCE (Formal Analysis) - APG-approved memos that supplement core policy with documented
  reasoning on specific accounting issues.


  **Usage Guidance:** Contains formal documented decisions on complex or judgmental accounting matters. Use when you need
  the reasoning behind an accounting treatment, precedent for similar situations, or understanding of alternatives that were
  considered and rejected. These represent formally approved APG positions with full technical analysis.


  **When to Select:** Questions seeking: documented rationale for accounting treatments, precedent on complex transactions,
  formal APG decisions on judgmental matters, analysis of why a particular approach was chosen, or historical decisions on
  accounting issues that required formal resolution.


  **Query Tips:** Focus on application scenarios, specific conclusions, and industry/scenario terms.


  **Query Type:** semantic search'
