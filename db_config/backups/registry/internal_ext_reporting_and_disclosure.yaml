db_description: '**Content:** RBC''s guidelines on material information disclosure, subsidiary reporting, trading revenue
  classification, and auditor independence to ensure compliance with regulatory frameworks such as OSFI, FRTB, and SEC standards.


  **Tier/Priority:** DOMAIN EXPERT - Specialized policies for external reporting and disclosure controls.


  **Usage Guidance:** Use for determining disclosure obligations, authorized spokesperson rules, trading revenue classification
  criteria, and requirements for engaging external auditors to maintain compliance.


  **When to Select:** Queries about material or non-material disclosure protocols, subsidiary or trading activity reporting,
  quiet period or spokesperson restrictions, trading revenue classification under FRTB/SEC expectations, auditor engagement
  and independence controls, or references to policies such as LAW-8, FIN-ACC-217, FIN-ACC-212, or FIN-ACC-213.


  **Query Tips:** Use terms like ''material information'', ''disclosure policy'', ''subsidiary reporting'', ''trading revenue'',
  ''FRTB'', ''auditor engagement'', ''auditor independence'', ''FIN-ACC-217'', ''FIN-ACC-212'', ''FIN-ACC-213''.


  **Query Type:** semantic search'
