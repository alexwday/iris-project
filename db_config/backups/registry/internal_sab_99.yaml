db_source: internal_sab_99
db_name: SAB 99 Memos
db_summary: Internal documents justifying the materiality assessment of financial statement errors, as guided by SEC Staff
  Accounting Bulletin No. 99. These memos are completed when financial statement errors exceed $120MM and include root cause
  analysis, control assessment, qualitative factor analysis, and remediation plans.
db_description: |-
  **Content:** Internal SAB 99 materiality assessment documentation stored as two complementary document types: (1) individual memo PDFs — one per materiality assessment — documenting root cause analysis, control assessment, qualitative factor analysis, and remediation plans for financial statement errors exceeding the $120MM threshold; and (2) quarterly summary sheets extracted from the "Summary of Errors" workbook (one document per fiscal quarter) which list and cross-reference all SAB 99 memos for that quarter with summary metadata.

  **Terminology:** "SUMs" (occasionally written as "SUM") is the internal acronym for **Summary of Unadjusted Misstatements**, which is the canonical name for these SAB 99 materiality assessment memos. Always use the full term "Summary of Unadjusted Misstatements" rather than the acronym when creating research statements and final responses.

  **Tier/Priority:** DOMAIN EXPERT - Specialized documentation for SAB 99 materiality assessments.

  **Usage Guidance:** For quarter-level questions (e.g., "which SUMs did we have in Q3 2024?", "how many errors in FY2024?", "list all materiality assessments for Q2"), prioritize the quarterly summary sheets as the authoritative cross-reference. For per-memo detail questions (e.g., "what was the root cause of the deposit error memo?", "what remediation was performed for the reconciliation break?"), prioritize the individual memo PDFs. Both document types may be relevant when a question combines quarter context with memo-specific detail.

  **When to Select:** Queries about SAB 99 materiality evaluations, Summary of Unadjusted Misstatements (SUMs), the $120MM threshold, quarterly error summaries, per-memo root cause and remediation analysis, qualitative factor analysis, control deficiency assessments, quantitative materiality thresholds, or documentation of immaterial versus material misstatements.

  **Query Tips:** Use full terminology: "Summary of Unadjusted Misstatements" is preferred over "SUMs". Relevant search terms include: "SAB 99", "materiality assessment", "Summary of Unadjusted Misstatements", "financial statement error", "$120MM threshold", "quantitative materiality", "qualitative factors", "root cause analysis", "control deficiency", "remediation plan", "error correction", "restatement assessment", "immaterial misstatement", "intentional misstatement", "earnings management", "quarterly error summary", "per-quarter SAB 99 listing".

  **Query Type:** semantic search
