db_source: internal_sab_99
db_name: SAB 99 Memos
db_summary: Internal documents justifying the materiality assessment of financial statement errors, as guided by SEC Staff
  Accounting Bulletin No. 99. These memos are completed when financial statement errors exceed $120MM and include root cause
  analysis, control assessment, qualitative factor analysis, and remediation plans.
db_description: |-
  **Content:** Internal SAB 99 memos — materiality assessment memos written under SEC Staff Accounting Bulletin No. 99 — stored as two complementary document types: (1) individual memo PDFs, one per SAB 99 materiality assessment, documenting root cause analysis, control assessment, qualitative factor analysis, and remediation plans for financial statement errors exceeding the $120MM threshold; and (2) quarterly summary sheets extracted from the "Summary of Errors" workbook (one document per fiscal quarter) which list and cross-reference all SAB 99 memos for that quarter with summary metadata such as error amounts, functional areas, and root cause categories.

  **Terminology:** This database concerns two related but distinct concepts that must not be conflated.

  - **SAB 99** stands for **SEC Staff Accounting Bulletin No. 99**, the SEC guidance under which these memos are prepared. The individual documents in this database are "SAB 99 memos" — internal materiality assessment memos written for financial statement errors that exceed the $120MM threshold. Either "SAB 99" or "SEC Staff Accounting Bulletin No. 99" is acceptable in research statements and responses; use whichever reads more naturally.

  - **SUMs** (occasionally written as "SUM") is the internal abbreviation for the **Summary of Uncorrected Misstatements** process — the internal workflow for identifying and tracking uncorrected misstatements in the financial statements. SAB 99 memos document the materiality assessments of errors surfaced through the SUMs process. Users often refer loosely to the errors or their corresponding memos as "SUMs", so when a user asks about "SUMs" they are typically asking about the uncorrected misstatements documented in SAB 99 memos. Always expand the acronym to "Summary of Uncorrected Misstatements" in research statements.

  - **Do not conflate SAB 99 and SUMs.** SAB 99 is the SEC regulatory framework and refers to the type of memo in this database. SUMs is the internal process that identifies uncorrected misstatements, which may then become the subject of SAB 99 memos. They are related but not synonyms — SAB 99 is the regulatory framework governing the memos, SUMs is the underlying workflow that generates the findings the memos assess.

  **Tier/Priority:** DOMAIN EXPERT - Specialized documentation for SAB 99 materiality assessments.

  **Usage Guidance:** For quarter-level questions (e.g., "which SUMs did we have in Q3 2024?", "list the SAB 99 memos for Q2", "how many materiality assessments in FY2024?"), prioritize the quarterly summary sheets as the authoritative cross-reference — they enumerate all SAB 99 memos for each fiscal quarter. For per-memo detail questions (e.g., "what was the root cause of the deposit error memo?", "what remediation was performed for the reconciliation break memo?"), prioritize the individual memo PDFs. Both document types may be relevant when a question combines quarter context with memo-specific detail.

  **When to Select:** Queries about SAB 99 memos, materiality evaluations under SEC Staff Accounting Bulletin No. 99, the Summary of Uncorrected Misstatements (SUMs) process, the $120MM materiality threshold, quarterly error summaries, per-memo root cause and remediation analysis, qualitative factor analysis, control deficiency assessments, quantitative materiality thresholds, or documentation of immaterial versus material misstatements.

  **Query Tips:** Use precise terminology: "SAB 99" or "SEC Staff Accounting Bulletin No. 99" refers to the regulatory framework and the memo type; "Summary of Uncorrected Misstatements" (preferred over the "SUMs" acronym) refers to the internal process that identifies misstatements. Relevant search terms include: "SAB 99", "SAB 99 memo", "SEC Staff Accounting Bulletin No. 99", "materiality assessment", "Summary of Uncorrected Misstatements", "SUMs process", "uncorrected misstatement", "financial statement error", "$120MM threshold", "quantitative materiality", "qualitative factors", "root cause analysis", "control deficiency", "remediation plan", "error correction", "restatement assessment", "immaterial misstatement", "intentional misstatement", "earnings management", "quarterly error summary", "per-quarter SAB 99 listing".

  **Query Type:** semantic search
