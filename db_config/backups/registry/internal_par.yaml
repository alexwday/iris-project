db_description: '**Content:** RBC''s internal policies and interpretations for Project Approval Requests (PAR), including
  workflow, processes, and compliance requirements.


  **Tier/Priority:** DOMAIN EXPERT - Specialized guidance for PAR governance and approvals.


  **Usage Guidance:** Use for approval level rules, required documentation, workflow steps, and governance expectations for
  PAR submissions.


  **When to Select:** Queries mentioning PAR approval thresholds, required meetings or governance steps, addendum requirements,
  workflow roles, or compliance obligations for project approvals.


  **Query Tips:** Use RBC terms and reference PAR processes/workflows. Include terms like ''PAR'', ''project approval'', ''approval
  level'', ''addendum'', ''GE meeting'', ''GOCx meeting''.


  **Query Type:** semantic search'
