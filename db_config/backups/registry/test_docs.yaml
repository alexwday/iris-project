db_source: test_docs
db_name: Test Documents
db_summary: Test documents for doc_refresh pipeline testing
db_description: '**Content:** Sample academic papers used to test the document refresh pipeline, including NLP and ML research
  papers.


  **Tier/Priority:** DOMAIN EXPERT - Specialized test content used only for pipeline validation.


  **Usage Guidance:** Use solely to validate document refresh or retrieval behavior; not intended for production accounting
  or policy research.


  **When to Select:** Explicit testing requests referencing sample test documents, academic NLP/ML topics in the test set,
  or verification of pipeline behavior; avoid selecting for real business questions.


  **Query Type:** semantic search'
