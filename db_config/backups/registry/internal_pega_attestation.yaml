db_source: internal_pega_attestation
db_name: PEGA Attestation
db_summary: RBC's policies, procedures, and training materials for the PEGA-based General Ledger attestation process, including
  the Enterprise GL Attestation Policy, SOD requirements, BRAG methodology, and comprehensive user guidance for monthly balance
  sheet reconciliations and attestations.
db_description: '**Content:** RBC''s comprehensive framework for General Ledger attestation including the Enterprise GL Attestation
  Policy, PEGA system user guides, and FAQs. Covers monthly attestation requirements, Standards of Documentation (SOD) preparation,
  risk-based review processes, BRAG reconciliation assessments, aging analysis, and governance structures for ensuring balance
  sheet accuracy.


  **Tier/Priority:** PRIMARY SOURCE - Authoritative RBC GL attestation policy and procedural guidance.


  **Usage Guidance:** Use for definitive requirements on GL reconciliations, attestation statuses, SOD components, review
  frequencies, PEGA system navigation, and compliance with RBC''s financial control framework. Essential for understanding
  monthly attestation deadlines, ownership hierarchies, and escalation procedures.


  **When to Select:** Queries about GL attestation requirements, SOD preparation standards, PEGA workflow processes, attestation
  status definitions (FR/RWE/RPI/NR), BRAG assessments, second-level review requirements, aging thresholds, clearings/transitory
  account treatment, or references to policies such as FIN-ACC-300-EN.


  **Query Tips:** Use terms like ''GL attestation'', ''PEGA'', ''SOD'', ''reconciliation'', ''BRAG'', ''attestation status'',
  ''Fully Reconciled'', ''RWE'', ''Not Reconciled'', ''second level review'', ''aging'', ''clearings accounts'', ''transitory
  accounts'', ''attestation deadline'', ''Controller freeze''.'
