db_source: internal_cheatsheets
db_name: APG Cheatsheets
db_summary: Concise, 1-2 page summaries and infographics on specific accounting topics, offering quick, visual guidance for
  key concepts and policies.
db_description: '**Content:** APG Cheatsheets - concise 1-2 page summaries and infographics on specific accounting topics,
  offering quick visual guidance for key concepts and policies. Contains decision trees, checklists, flowcharts, and visual
  summaries that distill complex topics into scannable formats.


  **Tier/Priority:** SUPPLEMENTARY SOURCE (Visual Quick Reference) - APG infographics that supplement core policy with visual
  aids for common accounting topics.


  **Usage Guidance:** Contains visual quick references for frequently asked accounting topics. Use when a scannable visual
  format would be helpful - decision trees, checklists, or infographic summaries. Best for well-established topics where APG
  has created visual aids to provide definitions and overviews.


  **When to Select:** Questions seeking: visual decision aids, checklists for accounting determinations, flowcharts for classification
  or recognition decisions, or quick visual summaries of common accounting topics.


  **Query Tips:** Use concise, topic-focused queries suitable for semantic search.


  **Query Type:** semantic search'
