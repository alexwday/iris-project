db_source: internal_sox
db_name: Internal SOX Controls
db_summary: RBC's SOX controls inventory, where each document represents an individual control with associated attributes
  such as control objective, process area, systems, and testing context.
db_description: '**Content:** Internal SOX controls repository where each document represents a single control record (for
  example control ID, control statement, process area, system references, and related control metadata).


  **Tier/Priority:** DOMAIN EXPERT - Specialized internal controls source for SOX control lookup and analysis.


  **Usage Guidance:** Use this database to find controls by process, system, keyword, or control characteristics. Best for
  questions that need sets of controls matching criteria (for example process ownership, system association, or text mentions).


  **When to Select:** Queries such as: all controls under a specific process area, controls mentioning a specific term, controls
  involving a specific system, or control discovery/filtering questions.


  **Query Tips:** Include process names, system names, control IDs, and targeted terms (for example ''SOX'', ''access review'',
  ''change management'', ''SAP'', ''revenue'', ''financial reporting'').


  **Query Type:** semantic search'
