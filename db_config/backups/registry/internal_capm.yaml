db_description: '**Content:** RBC''s comprehensive accounting policies covering recognition, measurement, disclosure, and
  compliance requirements under IFRS and U.S. GAAP frameworks. This is the official RBC policy manual.


  **Tier/Priority:** PRIMARY SOURCE - Authoritative RBC accounting policy manual; default source for accounting determinations.


  **Usage Guidance:** Use for definitive RBC-required accounting treatment, recognition thresholds, measurement rules, and
  disclosure obligations; rely on this for policy wording, required controls, and governance. Always check US GAAP flags when
  dual-GAAP treatment may apply.


  **When to Select:** Queries asking for RBC policy, acceptable accounting treatment, required disclosures, IFRS/U.S. GAAP
  application at RBC, or approval/exception conditions for accounting topics.


  **Query Tips:** Use RBC terms and policy areas. Check US GAAP flags for dual-reporting considerations.


  **Query Type:** semantic search'
