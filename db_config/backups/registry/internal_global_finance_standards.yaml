db_description: '**Content:** RBC''s policies on currency reporting, resident/non-resident splits, foreign exchange (FX) position
  accounts, the Global Chart of Accounts structure, and the Global Rates policy to ensure consistent financial reporting.


  **Tier/Priority:** DOMAIN EXPERT - Specialized standards for global finance reporting consistency.


  **Usage Guidance:** Use for guidance on currency and residency reporting rules, FX position account setup, chart of accounts
  structure, and required FX rates used in reporting.


  **When to Select:** Queries about currency reporting standards, resident versus non-resident requirements, FX position account
  usage, chart of accounts design or abbreviations, mandated global FX rates, or references to standards such as FIN-ACC-14
  or FIN-ACC-10.


  **Query Tips:** Use terms like ''currency reporting'', ''resident reporting'', ''FX position account'', ''chart of accounts'',
  ''global FX rates'', ''FIN-ACC-14'', ''FIN-ACC-10''.


  **Query Type:** semantic search'
