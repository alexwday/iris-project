db_description: '**Content:** External accounting guidance and interpretations from EY, including insights, disclosure checklists,
  and clarifications on the application of IFRS standards.


  **Tier/Priority:** EXTERNAL SUPPLEMENTARY - Third-party interpretations that support but do not replace official standards.


  **Usage Guidance:** Consult when explicitly requested by user OR when internal sources are insufficient and an external
  perspective would help. Use to supplement internal knowledge, fill gaps, or get external interpretation. Particularly useful
  for disclosure examples and checklists. Internal RBC guidance should remain preferred for policy questions.


  **When to Select:** Explicit requests for EY guidance, external/third-party interpretations, IFRS disclosure checklists,
  disclosure examples, or when internal sources lack sufficient detail on practical application.


  **Query Tips:** Use standard numbers (IFRS 15, IAS 38), technical terms, specific paragraphs.


  **Query Type:** semantic search'
