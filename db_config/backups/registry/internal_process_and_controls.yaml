db_description: '**Content:** RBC''s policies on general ledger naming conventions, intra-group account procedures, internal
  controls over financial reporting (ICFR), and the Enterprise Internal Control Management Policy (ICMP) aligned with COSO,
  SOX, and NI 52-109 frameworks.


  **Tier/Priority:** DOMAIN EXPERT - Specialized guidance for internal controls and process standards.


  **Usage Guidance:** Use for control framework expectations, GL naming standards, intra-group reconciliation processes, and
  ICFR/ICMP requirements tied to regulatory frameworks.


  **When to Select:** Queries about GL naming conventions, intra-group account handling, ICFR testing or documentation under
  SOX or NI 52-109, ICMP control activities, COSO alignment, or references to policies such as FIN-ACC-22 or FIN-ACC-201.


  **Query Tips:** Use terms like ''GL naming convention'', ''intra-group accounts'', ''ICFR'', ''SOX'', ''NI 52-109'', ''ICMP'',
  ''COSO framework'', ''FIN-ACC-22'', ''FIN-ACC-201''.


  **Query Type:** semantic search'
