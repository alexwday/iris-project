db_description: '**Content:** RBC''s policies and frameworks for ESG disclosures, including the ESG Materiality Framework
  and guidance on evaluating changes to prior period ESG information aligned with ISSB and CSRD expectations.


  **Tier/Priority:** DOMAIN EXPERT - Specialized ESG reporting policy and disclosure guidance.


  **Usage Guidance:** Use for ESG reporting requirements, materiality assessments, treatment of prior period changes, and
  alignment with external ESG frameworks.


  **When to Select:** Queries about ESG materiality thresholds, handling prior period ESG adjustments, required ESG metrics/disclosures,
  ISSB or CSRD alignment, or treatment of ESG measurement uncertainty.


  **Query Tips:** Use terms like ''ESG materiality'', ''prior period ESG'', ''ISSB alignment'', ''CSRD'', ''ESG metrics'',
  ''sustainability report'', ''measurement uncertainty''.


  **Query Type:** semantic search'
